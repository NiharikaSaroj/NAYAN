<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAYAN AI Classroom</title>


<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">


<!-- Bootstrap Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/responsive.css">


</head>


<body class="chat-body">


<!-- NAVBAR -->

<nav class="navbar fixed-top glass-nav">

<div class="container">

<a class="navbar-brand fw-bold fs-3">
🧠 NAYAN
</a>


<a href="index.html"
class="btn btn-outline-primary">

<i class="bi bi-house"></i>

</a>


</div>

</nav>



<!-- CHAT AREA -->

<section class="chat-section">


<div class="container">


<div class="chat-container">


<!-- HEADER -->

<div class="chat-header text-center">

<h3>
🤖 NAYAN AI Teacher
</h3>

<p>
Sight Beyond Vision
</p>

</div>



<!-- MESSAGES -->

<div class="chat-messages" id="chatMessages">


<div class="ai-message">


<div class="message-avatar">

🤖

</div>


<div class="message-content">


<h6>
Hello 👋
</h6>


<p>
I'm NAYAN, your AI learning assistant.
</p>


<p>
Ask me anything about NCERT Class 6 Science.
</p>


<button class="btn btn-sm btn-primary">

🔊 Listen

</button>


</div>


</div>



</div>





<!-- INPUT AREA -->


<div class="chat-input-area">


<button class="btn btn-primary mic-btn">

<i class="bi bi-mic-fill"></i>

</button>



<input 
type="text"
id="userInput"
class="form-control"
placeholder="Ask NAYAN your question..."
>



<button 
class="btn btn-primary"
id="sendBtn">

<i class="bi bi-send-fill"></i>

</button>


</div>



<!-- ACTION BUTTONS -->

<div class="p-3 d-flex gap-3 justify-content-center">


<button class="btn btn-outline-primary">

📝 Generate Quiz

</button>


<button class="btn btn-outline-primary">

🔊 Speak Response

</button>


</div>



</div>


</div>


</section>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


<script src="js/api.js"></script>
<script src="js/chat.js"></script>


</body>

</html>
